name: Sync Fork

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with Upstream
        run: |
          git config user.name "gwjessica"
          git config user.email "jjgabrielwong@gmail.com"
          git remote add upstream https://github.com/VennZx7/TaSkill.git
          git fetch upstream
          git checkout main
          git merge upstream/main --allow-unrelated-histories -X theirs --no-ff -m "chore: sync with upstream"
          git commit --amend --reset-author --no-edit
          git push origin main --force
